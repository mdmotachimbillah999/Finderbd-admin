<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Finderbd Admin</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f7f8fa;color:#182331;font-family:Arial,"Noto Sans Bengali",sans-serif}.wrap{max-width:1100px;margin:auto;padding:14px}.box{background:#fff;border:1px solid #e7ebef;border-radius:20px;box-shadow:0 8px 30px #0000000a}.login{max-width:430px;margin:8vh auto;padding:24px}.logo{width:58px;height:58px;border-radius:17px;background:#ec0068;color:#fff;display:flex;align-items:center;justify-content:center;font-size:28px}h1{margin:10px 0 4px}h2{margin:0}.muted{color:#71808c}.field{margin:12px 0}.field label{display:block;font-weight:700;font-size:13px;margin-bottom:6px}input,select,textarea{width:100%;padding:11px;border:1px solid #dce2e7;border-radius:11px;font-size:15px;background:#fff}textarea{min-height:85px;resize:vertical}button{border:0;border-radius:11px;padding:10px 14px;background:#ec0068;color:#fff;font-weight:700;cursor:pointer}.secondary{background:#eef1f4;color:#26313b}.danger{background:#e53935}.top{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:14px 16px;position:sticky;top:0;z-index:4}.top small{display:block;color:#74808c}.layout{display:grid;grid-template-columns:220px 1fr;gap:14px;margin-top:14px}.side{padding:10px;align-self:start;position:sticky;top:82px}.nav{width:100%;text-align:left;background:transparent;color:#25313b;margin:2px 0}.nav.active{background:#fff0f6;color:#c80059}.content{padding:16px;min-height:70vh}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.stat{padding:14px;border:1px solid #e7ebef;border-radius:15px;background:#fff}.stat b{font-size:24px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}.tablewrap{overflow:auto;border:1px solid #e8ebef;border-radius:14px}.table{width:100%;border-collapse:collapse;min-width:720px}.table th,.table td{padding:10px;border-bottom:1px solid #edf0f2;text-align:left;vertical-align:top;font-size:13px}.table th{background:#fafbfc}.pill{display:inline-block;padding:4px 8px;border-radius:999px;background:#eef1f4;font-size:12px}.ok{background:#e9fff3;color:#08753d}.bad{background:#fff0f0;color:#b42318}.modal{position:fixed;inset:0;background:#0006;display:none;align-items:flex-end;justify-content:center;z-index:20}.modal.open{display:flex}.modalbox{background:#fff;width:min(680px,100%);max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:18px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.msg{margin-top:10px;padding:10px;border-radius:10px;background:#fff0f6;color:#8d0041}.hidden{display:none}@media(max-width:800px){.layout{grid-template-columns:1fr}.side{position:static;display:flex;overflow:auto;gap:5px}.nav{white-space:nowrap;width:auto}.stats{grid-template-columns:1fr 1fr}.content{padding:12px}.top{position:static}}@media(max-width:520px){.stats,.grid2{grid-template-columns:1fr}.top{align-items:flex-start}.top button{padding:8px 10px}}
</style></head>
<body>
<div id="loginBox" class="box login"><div class="logo">⌖</div><h1>Finderbd Admin</h1><p class="muted">Supabase secure admin panel</p><div class="field"><label>Email</label><input id="email" type="email" autocomplete="username"></div><div class="field"><label>Password</label><input id="password" type="password" autocomplete="current-password"></div><button onclick="login()">Login</button><div id="loginMsg"></div></div>
<div id="app" class="hidden"><div class="wrap"><div class="box top"><div><b>Finderbd Admin</b><small id="who"></small></div><button class="secondary" onclick="logout()">Logout</button></div><div class="layout"><aside class="box side" id="nav"></aside><main class="box content" id="content"></main></div></div></div>
<div id="modal" class="modal"><div class="modalbox"><div style="display:flex;justify-content:space-between;align-items:center"><h2 id="modalTitle">Edit</h2><button class="secondary" onclick="closeModal()">✕</button></div><div id="modalBody"></div></div></div>
<script src="config.js"></script>
<script>
const cfg=window.FINDERBD_CONFIG||{};
const API=String(cfg.SUPABASE_URL||'').replace(/\/$/,'');
const KEY=cfg.SUPABASE_ANON_KEY||'';
let accessToken=sessionStorage.getItem('finderbd_access_token')||'';let user=null,current='dashboard';
const menus=[['dashboard','📊','Dashboard'],['profiles','👥','Profiles'],['categories','🛠️','Categories'],['locations','📍','Locations'],['packages','💎','Packages'],['featured','⭐','Featured Profiles'],['banners','🖼️','Banners'],['announcements','📢','Updates & Offers'],['bookings','🚕','Bookings'],['notifications','🔔','Notifications'],['settings','⚙️','Settings']];
function esc(s){return String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function toast(s,ok=false){document.getElementById('loginMsg').innerHTML='<div class="msg" style="'+(ok?'background:#e9fff3;color:#08753d':'')+'">'+esc(s)+'</div>'}
async function api(path,opts={}){const h=Object.assign({'apikey':KEY,'Content-Type':'application/json'},opts.headers||{});if(accessToken)h.Authorization='Bearer '+accessToken;const r=await fetch(API+path,Object.assign({},opts,{headers:h}));let data=null;try{data=await r.json()}catch{}if(!r.ok)throw new Error(data?.msg||data?.message||data?.error_description||data?.error||('HTTP '+r.status));return {data,headers:r.headers}}
async function login(){toast('');let email=document.getElementById('email').value.trim(),password=document.getElementById('password').value;if(!email||!password)return toast('Email ও Password দিন।');if(!API||!KEY)return toast('Supabase config পাওয়া যায়নি।');try{const r=await api('/auth/v1/token?grant_type=password',{method:'POST',body:JSON.stringify({email,password})});accessToken=r.data.access_token;sessionStorage.setItem('finderbd_access_token',accessToken);user=r.data.user;const q=await api('/rest/v1/admin_users?select=user_id,role,is_active&user_id=eq.'+encodeURIComponent(user.id)+'&limit=1');const a=Array.isArray(q.data)?q.data[0]:null;if(!a||a.is_active!==true){await logout(true);return toast('এই account-এর Admin permission নেই।')}enter(user)}catch(e){toast('Login হয়নি: '+e.message)}}
function enter(u){user=u;document.getElementById('loginBox').classList.add('hidden');document.getElementById('app').classList.remove('hidden');document.getElementById('who').textContent=u.email||'';renderNav();go('dashboard')}
async function logout(silent=false){accessToken='';sessionStorage.removeItem('finderbd_access_token');if(!silent)location.reload()}
function renderNav(){document.getElementById('nav').innerHTML=menus.map(m=>`<button class="nav ${m[0]===current?'active':''}" onclick="go('${m[0]}')">${m[1]} ${m[2]}</button>`).join('')}
async function go(page){current=page;renderNav();if(page==='dashboard')return dashboard();return listPage(page)}
async function dashboard(){document.getElementById('content').innerHTML='<h2>Dashboard</h2><p class="muted">Finderbd-এর সব গুরুত্বপূর্ণ অংশ এখান থেকে নিয়ন্ত্রণ করুন।</p><div id="stats" class="stats">Loading...</div><div style="margin-top:18px" class="box"><div style="padding:16px"><b>Admin status</b><p class="muted">Signed in as '+esc(user.email)+'</p></div></div>';let tables=['profiles','categories','packages','bookings'];let vals=await Promise.all(tables.map(async t=>{try{const r=await api('/rest/v1/'+t+'?select=id&limit=1',{headers:{'Prefer':'count=exact','Range':'0-0'}});const cr=r.headers.get('content-range');return {count:cr&&cr.includes('/')?Number(cr.split('/')[1]):(Array.isArray(r.data)?r.data.length:0)}}catch{return {count:0}}}));document.getElementById('stats').innerHTML=vals.map((r,i)=>`<div class="stat"><span class="muted">${tables[i]}</span><br><b>${r.count??0}</b></div>`).join('')}
const defs={
profiles:{title:'Profiles',fields:[['full_name','নাম','text'],['phone','ফোন','text'],['profession','পেশা','text'],['division','বিভাগ','text'],['district','জেলা','text'],['upazila','উপজেলা','text'],['union_name','ইউনিয়ন','text'],['area','এলাকা','text'],['bio','বায়ো','textarea'],['is_online','Online','bool'],['is_approved','Approved','bool'],['is_blocked','Blocked','bool']],cols:['full_name','profession','phone','district','is_online','is_approved','is_blocked']},
categories:{title:'Categories',fields:[['name','নাম','text'],['icon','Icon','text'],['sort_order','Sort order','number'],['is_active','Active','bool']],cols:['name','icon','sort_order','is_active']},
locations:{title:'Locations',fields:[['division','বিভাগ','text'],['district','জেলা','text'],['upazila','উপজেলা','text'],['union_name','ইউনিয়ন','text'],['area','এলাকা','text'],['is_active','Active','bool']],cols:['division','district','upazila','union_name','area','is_active']},
packages:{title:'Packages',fields:[['name','নাম','text'],['price','মূল্য','number'],['duration_minutes','সময় (মিনিট)','number'],['category_id','Category ID','text'],['area','এলাকা','text'],['description','বিবরণ','textarea'],['is_active','Active','bool']],cols:['name','price','duration_minutes','area','is_active']},
banners:{title:'Banners',fields:[['title','Title','text'],['subtitle','Subtitle','text'],['image_url','Image URL','text'],['button_text','Button text','text'],['button_url','Button URL','text'],['category','Category','text'],['area','Area','text'],['starts_at','Starts at','datetime-local'],['expires_at','Expires at','datetime-local'],['is_active','Active','bool'],['sort_order','Sort order','number']],cols:['title','category','area','is_active','sort_order']},
announcements:{title:'Updates & Offers',fields:[['title','Title','text'],['body','Body','textarea'],['image_url','Image URL','text'],['category','Category','text'],['area','Area','text'],['starts_at','Starts at','datetime-local'],['expires_at','Expires at','datetime-local'],['is_active','Active','bool'],['sort_order','Sort order','number']],cols:['title','category','area','is_active','sort_order']},
bookings:{title:'Bookings',fields:[],cols:['customer_name','customer_phone','vehicle_type','pickup','destination','status','created_at']},
notifications:{title:'Notifications',fields:[['user_id','User ID','text'],['title','Title','text'],['body','Body','textarea'],['type','Type','text'],['is_read','Read','bool']],cols:['user_id','title','type','is_read','created_at']},
settings:{title:'Settings',fields:[['key','Key','text'],['value','Value JSON','textarea']],cols:['key','value','updated_at']}};
async function listPage(page){let d=defs[page];if(page==='featured')return featuredPage();let table=page==='settings'?'admin_settings':page;try{let order=page==='settings'?'key':'created_at';let {data}=await api('/rest/v1/'+table+'?select=*&order='+order+'.desc&limit=100');let c=document.getElementById('content');c.innerHTML=`<div style="display:flex;justify-content:space-between;gap:10px;align-items:center"><div><h2>${d.title}</h2><p class="muted">সর্বশেষ ১০০টি রেকর্ড</p></div>${d.fields.length?'<button onclick="openForm(\''+page+'\')">＋ Add</button>':''}</div><div class="toolbar"><input id="filter" placeholder="Search..." oninput="filterRows()"></div><div class="tablewrap"><table class="table"><thead><tr>${d.cols.map(x=>'<th>'+esc(x)+'</th>').join('')}<th>Action</th></tr></thead><tbody id="rows">${data.map(r=>rowHtml(page,r,d.cols)).join('')}</tbody></table></div>`}catch(e){document.getElementById('content').innerHTML='<h2>'+d.title+'</h2><div class="msg">'+esc(e.message)+'</div>'}}
function val(v){if(typeof v==='boolean')return `<span class="pill ${v?'ok':'bad'}">${v?'Yes':'No'}</span>`;if(v&&typeof v==='object')return esc(JSON.stringify(v));return esc(v)}
function rowHtml(page,r,cols){return `<tr data-search="${esc(JSON.stringify(r).toLowerCase())}">${cols.map(c=>`<td>${val(r[c])}</td>`).join('')}<td><button class="secondary" onclick='openForm(${JSON.stringify(page)},${JSON.stringify(r)})'>Edit</button> <button class="danger" onclick='removeRow(${JSON.stringify(page)},${JSON.stringify(r.id||r.key)})'>Delete</button></td></tr>`}
function filterRows(){let q=document.getElementById('filter').value.toLowerCase();document.querySelectorAll('#rows tr').forEach(r=>r.style.display=r.dataset.search.includes(q)?'':'none')}
function openForm(page,row={}){let d=defs[page];document.getElementById('modalTitle').textContent=(row.id||row.key?'Edit ':'Add ')+d.title;document.getElementById('modalBody').innerHTML=`<form onsubmit="saveForm(event,'${page}',${JSON.stringify(row).replace(/"/g,'&quot;')})">${d.fields.map(([k,l,t])=>{let v=row[k];if(t==='bool')return `<div class="field"><label>${l}</label><select name="${k}"><option value="true" ${v===true?'selected':''}>True</option><option value="false" ${v===false?'selected':''}>False</option></select></div>`;return `<div class="field"><label>${l}</label>${t==='textarea'?`<textarea name="${k}">${esc(v)}</textarea>`:`<input name="${k}" type="${t}" value="${esc(v)}" ${k==='key'&&row.key?'readonly':''}>`}</div>`}).join('')}<button type="submit">Save</button></form>`;document.getElementById('modal').classList.add('open')}
function closeModal(){document.getElementById('modal').classList.remove('open')}
async function saveForm(e,page,row){e.preventDefault();let fd=new FormData(e.target),obj={};defs[page].fields.forEach(([k,,t])=>{let v=fd.get(k);if(t==='bool')v=v==='true';else if(t==='number')v=v===''?0:Number(v);else if(t==='datetime-local')v=v?new Date(v).toISOString():null;else if(page==='settings'&&k==='value'){try{v=JSON.parse(v)}catch{return alert('Value JSON সঠিক নয়')}}obj[k]=v});let table=page==='settings'?'admin_settings':page;try{let path='/rest/v1/'+table;let method='POST';let headers={};if(row.id||row.key){method='PATCH';path+='?'+encodeURIComponent(page==='settings'?'key':'id')+'=eq.'+encodeURIComponent(row.id||row.key)}else{headers['Prefer']='return=minimal'}await api(path,{method,headers,body:JSON.stringify(obj)});closeModal();listPage(page)}catch(e){alert(e.message)}}
async function removeRow(page,id){if(!confirm('Delete করবেন?'))return;let table=page==='settings'?'admin_settings':page;try{await api('/rest/v1/'+table+'?'+encodeURIComponent(page==='settings'?'key':'id')+'=eq.'+encodeURIComponent(id),{method:'DELETE'});listPage(page)}catch(e){alert(e.message)}}
async function featuredPage(){try{let {data}=await api('/rest/v1/featured_profiles?select=*,profiles(full_name,profession,phone)&order=sort_order.asc');let c=document.getElementById('content');c.innerHTML='<h2>Featured Profiles</h2><p class="muted">Featured slider-এর রেকর্ড দেখুন ও প্রয়োজন হলে বন্ধ করুন।</p><div class="tablewrap"><table class="table"><thead><tr><th>Profile</th><th>Category</th><th>Area</th><th>Starts</th><th>Expires</th><th>Active</th><th>Action</th></tr></thead><tbody>'+data.map(r=>`<tr><td>${esc(r.profiles?.full_name||r.profile_id)}</td><td>${esc(r.category)}</td><td>${esc(r.area)}</td><td>${esc(r.starts_at)}</td><td>${esc(r.expires_at)}</td><td>${val(r.is_active)}</td><td><button class="secondary" onclick='toggleFeatured(${JSON.stringify(r.id)},${JSON.stringify(!r.is_active)})'>${r.is_active?'Disable':'Enable'}</button></td></tr>`).join('')+'</tbody></table></div>'}catch(e){document.getElementById('content').innerHTML='<h2>Featured Profiles</h2><div class="msg">'+esc(e.message)+'</div>'}}
async function toggleFeatured(id,on){try{await api('/rest/v1/featured_profiles?id=eq.'+encodeURIComponent(id),{method:'PATCH',body:JSON.stringify({is_active:on})});featuredPage()}catch(e){alert(e.message)}}
async function restore(){if(!accessToken)return;try{const q=await api('/auth/v1/user');user=q.data;const a=await api('/rest/v1/admin_users?select=user_id,role,is_active&user_id=eq.'+encodeURIComponent(user.id)+'&limit=1');if(Array.isArray(a.data)&&a.data[0]?.is_active===true)enter(user);else logout(true)}catch{logout(true)}}
restore();
</script></body></html>
